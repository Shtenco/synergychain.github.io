name: Build MIDAS Exact Zlib DLL

on:
  pull_request:
    paths:
      - 'ops/midas-zlib/**'
      - '.github/workflows/build-midas-zlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout zlib 1.3.1
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib
      - name: Configure and build zlib x64
        shell: pwsh
        run: |
          cmake -S zlib -B zbuild -A x64 -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build zbuild --config Release --target zlibstatic
      - name: Configure and build wrapper x64
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace('\\','/')
          cmake -S ops/midas-zlib -B wrapper-build -A x64 -DZLIB_SOURCE_DIR="$root/zlib" -DZLIB_BUILD_DIR="$root/zbuild"
          cmake --build wrapper-build --config Release
          Copy-Item wrapper-build/Release/MidasExactZlib.dll .
      - name: Verify exports
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio' -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64.x64' } | Select-Object -First 1
          & $dumpbin.FullName /exports MidasExactZlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: MidasExactZlib-x64
          path: MidasExactZlib.dll
          compression-level: 0
          retention-days: 1
