name: Build MIDAS Exact Zlib DLL

on:
  pull_request:
    paths:
      - 'ops/midas-zlib/**'
      - '.github/workflows/build-midas-zlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout zlib 1.3.1
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: v1.3.1
          path: zlib
      - name: Configure zlib x64
        shell: pwsh
        run: cmake -S zlib -B zbuild -A x64 -DZLIB_BUILD_EXAMPLES=OFF
      - name: Build zlib static
        shell: pwsh
        run: cmake --build zbuild --config Release --target zlibstatic
      - name: Build exact wrapper DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /LD /MT /I zlib ops\midas-zlib\MidasExactZlib.c zbuild\Release\zlibstatic.lib user32.lib /link /OUT:MidasExactZlib.dll
      - name: Verify exports
        shell: cmd
        run: dumpbin /exports MidasExactZlib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: MidasExactZlib-x64
          path: MidasExactZlib.dll
          compression-level: 0
          retention-days: 1
