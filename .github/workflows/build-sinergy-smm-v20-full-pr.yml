name: Build SINERGY SMM v2 FULL APK PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Recover and restore full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sinergy-smm-full
          python3 - <<'PY'
          import base64,gzip,pathlib,time,zlib
          paths=[pathlib.Path(f'smm-v2-build/source.b64.part0{i}') for i in range(5)]
          parts=[''.join(p.read_text().split()) for p in paths]
          print('part_lengths', [len(x) for x in parts])
          assert [len(x) for x in parts]==[10000,16000,15999,16000,7380]
          s=''.join(parts)
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          p2_start=len(parts[0])+len(parts[1])
          p2_end=p2_start+len(parts[2])
          def test(pos,ch):
              c=s[:pos]+ch+s[pos:]
              try:
                  raw=base64.b64decode(c,validate=True)
                  gzip.decompress(raw)
              except Exception:
                  return False
              pathlib.Path('/tmp/source.tar.gz').write_bytes(raw)
              pathlib.Path('/tmp/recovered.txt').write_text(f'position={pos}\nchar={ch}\n')
              print('RECOVERED',pos,ch,'gzip_bytes',len(raw))
              return True
          # A one-character-short chunk is most commonly a dropped edge character.
          positions=[]
          for center in (p2_end,p2_start):
              for d in range(0,257):
                  for pos in ({center-d,center+d} if d else {center}):
                      if p2_start <= pos <= p2_end and pos not in positions:
                          positions.append(pos)
          t=time.time()
          for pos in positions:
              for ch in alphabet:
                  if test(pos,ch):
                      print('fast_recovery_seconds',round(time.time()-t,2),'positions_tested',positions.index(pos)+1)
                      raise SystemExit(0)
          # Pinpoint where the corrupted decoded stream first breaks, then search a tighter neighborhood.
          eq=s.find('=')
          probe=s[:eq]+'A'+s[eq:]
          raw=base64.b64decode(probe,validate=True)
          d=zlib.decompressobj(31); err=None
          for i in range(0,len(raw),64):
              try: d.decompress(raw[i:i+64])
              except zlib.error:
                  err=i; break
          approx=max(p2_start,min(p2_end,int((err or 0)*4/3)))
          print('approx_position',approx,'deflate_error_byte',err)
          for radius in (512,2048):
              lo=max(p2_start,approx-radius); hi=min(p2_end,approx+radius)
              for pos in range(lo,hi+1):
                  for ch in alphabet:
                      if test(pos,ch): raise SystemExit(0)
          raise SystemExit('Unable to recover missing base64 character')
          PY
          gzip -t /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C /tmp/sinergy-smm-full
          test -s /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html
          cat /tmp/recovered.txt
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify full UI source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          node --check "$ROOT/js/app.js"
          ROUTES=$(grep -o 'class="route' "$ROOT/index.html" | wc -l)
          echo "routes=$ROUTES"
          test "$ROUTES" -ge 12
          for route in home studio calendar publisher inbox leads audience analytics brain autopilot integrations settings; do grep -q "data-route=\"$route\"" "$ROOT/index.html"; done
          test "$(wc -c < "$ROOT/index.html")" -gt 20000
          test "$(wc -c < "$ROOT/css/app.css")" -gt 100000
          test "$(wc -c < "$ROOT/js/app.js")" -gt 35000
          grep -q 'smm-logo.svg' "$ROOT/index.html"
          test -s "$ROOT/css/smm.css"
          test -s "$ROOT/icons/smm-logo.svg"
      - name: Build installable APK
        working-directory: /tmp/sinergy-smm-full/android
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/sinergy-smm-full/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/apk-files.txt
          for f in assets/www/index.html assets/www/js/app.js assets/www/css/app.css assets/www/css/smm.css assets/www/icons/smm-logo.svg res/drawable/ic_launcher.xml; do grep -q "$f" /tmp/apk-files.txt; done
          mkdir -p /tmp/dist
          cp "$APK" /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk
          sha256sum /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk > /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk.sha256
          cp /tmp/recovered.txt /tmp/dist/SOURCE-RECOVERY.txt
          printf 'routes=12\nindex_bytes=%s\napp_css_bytes=%s\nsmm_css_bytes=%s\napp_js_bytes=%s\n' "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/app.css)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/smm.css)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/js/app.js)" > /tmp/dist/BUILD-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.0.0-FULL-BETA-APK
          path: /tmp/dist/*
          if-no-files-found: error
          retention-days: 30
