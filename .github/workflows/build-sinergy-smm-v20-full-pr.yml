name: Build SINERGY SMM v2 FULL APK PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore full source from deterministic chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sinergy-smm-full
          for f in smm-v2-build/source.b64.part00 smm-v2-build/source.b64.part01 smm-v2-build/source.b64.part02 smm-v2-build/source.b64.part03 smm-v2-build/source.b64.part04; do
            printf '%s bytes=' "$f"; wc -c < "$f"
          done
          cat smm-v2-build/source.b64.part00 smm-v2-build/source.b64.part01 smm-v2-build/source.b64.part02 smm-v2-build/source.b64.part03 smm-v2-build/source.b64.part04 | tr -d '\r\n\t ' > /tmp/source.raw.b64
          echo "raw_normalized_bytes=$(wc -c < /tmp/source.raw.b64)"
          python3 - <<'PY'
          import base64,gzip,pathlib
          s=pathlib.Path('/tmp/source.raw.b64').read_text().strip()
          candidates=[]
          eq=s.find('=')
          if eq>=0:
              end=eq+1
              while end < len(s) and s[end]=='=': end+=1
              candidates.append(('first_padding',s[:end]))
          candidates.append(('canonical_len',s[:63380]))
          candidates.append(('full',s))
          seen=set()
          for name,c in candidates:
              if c in seen: continue
              seen.add(c)
              try:
                  cc=c + '='*((-len(c))%4)
                  raw=base64.b64decode(cc, validate=False)
                  gzip.decompress(raw)
                  pathlib.Path('/tmp/source.tar.gz').write_bytes(raw)
                  print('RECOVERED',name,'b64_bytes',len(c),'gzip_bytes',len(raw))
                  break
              except Exception as e:
                  print('candidate_failed',name,len(c),type(e).__name__,str(e)[:160])
          else:
              raise SystemExit('No candidate produced a valid gzip stream')
          PY
          gzip -t /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C /tmp/sinergy-smm-full
          test -s /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify full UI source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          node --check "$ROOT/js/app.js"
          ROUTES=$(grep -o 'class="route' "$ROOT/index.html" | wc -l)
          test "$ROUTES" -ge 12
          for route in home studio calendar publisher inbox leads audience analytics brain autopilot integrations settings; do grep -q "data-route=\"$route\"" "$ROOT/index.html"; done
          test "$(wc -c < "$ROOT/index.html")" -gt 20000
          test "$(wc -c < "$ROOT/css/app.css")" -gt 100000
          test "$(wc -c < "$ROOT/js/app.js")" -gt 35000
          grep -q 'smm-logo.svg' "$ROOT/index.html"
          test -s "$ROOT/css/smm.css"
          test -s "$ROOT/icons/smm-logo.svg"
      - name: Build installable APK
        working-directory: /tmp/sinergy-smm-full/android
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/sinergy-smm-full/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/apk-files.txt
          for f in assets/www/index.html assets/www/js/app.js assets/www/css/app.css assets/www/css/smm.css assets/www/icons/smm-logo.svg res/drawable/ic_launcher.xml; do grep -q "$f" /tmp/apk-files.txt; done
          mkdir -p /tmp/dist
          cp "$APK" /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk
          sha256sum /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk > /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk.sha256
          printf 'routes=12\nindex_bytes=%s\napp_css_bytes=%s\nsmm_css_bytes=%s\napp_js_bytes=%s\n' "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/app.css)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/smm.css)" "$(wc -c < /tmp/sinergy-smm-full/android/app/src/main/assets/www/js/app.js)" > /tmp/dist/BUILD-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.0.0-FULL-BETA-APK
          path: /tmp/dist/*
          if-no-files-found: error
          retention-days: 30
