name: Build SINERGY SMM v2 FULL APK PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore clean full source
        shell: bash
        run: |
          set -euo pipefail
          cat smm-v2-clean/part00 smm-v2-clean/part01 smm-v2-clean/part02 smm-v2-clean/part03 smm-v2-clean/part04 smm-v2-clean/part05 smm-v2-clean/part06 smm-v2-clean/part07 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 63412
          echo "c94839585d53daadde6f2bb35e0fd41dcd84c7154cf90ce351d74563059df3bc  /tmp/source.b64" | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "056801942413089735dea03b37f608a9283340a451792a69c1eb040a9b6ab305  /tmp/source.tar.gz" | sha256sum -c -
          gzip -t /tmp/source.tar.gz
          mkdir -p /tmp/sinergy-smm-full
          tar -xzf /tmp/source.tar.gz -C /tmp/sinergy-smm-full
          test -s /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html
      - name: Fix Android Gradle DSL
        shell: bash
        run: |
          cat > /tmp/sinergy-smm-full/android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ai.sinergy.smm'
              compileSdk 36

              defaultConfig {
                  applicationId 'ai.sinergy.smm'
                  minSdk 26
                  targetSdk 36
                  versionCode 200
                  versionName '2.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.webkit:webkit:1.14.0'
          }
          EOF
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify full UI source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          node --check "$ROOT/js/app.js"
          ROUTES=$(grep -o 'class="route' "$ROOT/index.html" | wc -l)
          echo "routes=$ROUTES"
          test "$ROUTES" -ge 12
          for route in home studio calendar publisher inbox leads audience analytics brain autopilot integrations settings; do grep -q "data-route=\"$route\"" "$ROOT/index.html"; done
          test "$(wc -c < "$ROOT/index.html")" -gt 20000
          test "$(wc -c < "$ROOT/css/app.css")" -gt 100000
          test "$(wc -c < "$ROOT/js/app.js")" -gt 35000
          grep -q 'smm-logo.svg' "$ROOT/index.html"
          test -s "$ROOT/css/smm.css"
          test -s "$ROOT/icons/smm-logo.svg"
      - name: Build installable APK
        working-directory: /tmp/sinergy-smm-full/android
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          APK=$(find /tmp/sinergy-smm-full/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/apk-files.txt
          for f in assets/www/index.html assets/www/js/app.js assets/www/css/app.css assets/www/css/smm.css assets/www/icons/smm-logo.svg res/drawable/ic_launcher.xml; do grep -q "$f" /tmp/apk-files.txt; done
          mkdir -p /tmp/dist
          cp "$APK" /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk
          sha256sum /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk > /tmp/dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk.sha256
          printf 'routes=12\nindex_bytes=%s\napp_css_bytes=%s\nsmm_css_bytes=%s\napp_js_bytes=%s\n' "$(wc -c < "$ROOT/index.html")" "$(wc -c < "$ROOT/css/app.css")" "$(wc -c < "$ROOT/css/smm.css")" "$(wc -c < "$ROOT/js/app.js")" > /tmp/dist/BUILD-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.0.0-FULL-BETA-APK
          path: /tmp/dist/*
          if-no-files-found: error
          retention-days: 30
