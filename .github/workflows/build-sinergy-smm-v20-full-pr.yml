name: Build SINERGY SMM v2.1 RELEASE APK PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore verified full v2 source
        shell: bash
        run: |
          set -euo pipefail
          cat smm-v2-clean/part00 smm-v2-clean/part01 smm-v2-clean/part02 smm-v2-clean/part03 smm-v2-clean/part04 smm-v2-clean/part05 smm-v2-clean/part06 smm-v2-clean/part07 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 63412
          echo "c94839585d53daadde6f2bb35e0fd41dcd84c7154cf90ce351d74563059df3bc  /tmp/source.b64" | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "056801942413089735dea03b37f608a9283340a451792a69c1eb040a9b6ab305  /tmp/source.tar.gz" | sha256sum -c -
          gzip -t /tmp/source.tar.gz
          rm -rf /tmp/sinergy-smm-full
          mkdir -p /tmp/sinergy-smm-full
          tar -xzf /tmp/source.tar.gz -C /tmp/sinergy-smm-full
          test -s /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html

      - name: Apply v2.1 Android identity and exact Finance branding
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/sinergy-smm-full/android/app
          ROOT="$APP/src/main/assets/www"

          cat > "$APP/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ai.sinergy.smm'
              compileSdk 36
              defaultConfig {
                  applicationId 'ai.sinergy.smm.full'
                  minSdk 26
                  targetSdk 36
                  versionCode 210
                  versionName '2.1.0'
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.webkit:webkit:1.14.0'
          }
          EOF

          mkdir -p "$APP/src/main/res/drawable" "$APP/src/main/res/values-v31" "$ROOT/icons"
          cp smm-v2-branding/sinergy-logo.png "$ROOT/icons/sinergy-logo.png"
          cp smm-v2-branding/sinergy-logo.png "$APP/src/main/res/drawable/sinergy_logo.png"
          echo "28eeefc12e9e0ca5e514cf94938854e798f12674c2f6b9a00bd1a6b571fa8c0  $ROOT/icons/sinergy-logo.png" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/sinergy-smm-full/android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/sinergy_logo"', s)
          if 'android:roundIcon=' in s:
              s=re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/sinergy_logo"', s)
          else:
              s=s.replace('android:icon="@drawable/sinergy_logo"', 'android:icon="@drawable/sinergy_logo" android:roundIcon="@drawable/sinergy_logo"')
          p.write_text(s,encoding='utf-8')
          idx=Path('/tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html')
          h=idx.read_text(encoding='utf-8').replace('icons/smm-logo.svg','icons/sinergy-logo.png').replace('v2.0.0 FULL','v2.1.0 FULL')
          idx.write_text(h,encoding='utf-8')
          PY

          cat > "$APP/src/main/res/values-v31/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:navigationBarColor">#020403</item>
              <item name="android:statusBarColor">#020403</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#020403</item>
              <item name="android:windowSplashScreenBackground">#020403</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/sinergy_logo</item>
            </style>
          </resources>
          EOF

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify full UI source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          node --check "$ROOT/js/app.js"
          ROUTES=$(grep -o 'class="route' "$ROOT/index.html" | wc -l)
          test "$ROUTES" -ge 12
          for route in home studio calendar publisher inbox leads audience analytics brain autopilot integrations settings; do grep -q "data-route=\"$route\"" "$ROOT/index.html"; done
          test "$(wc -c < "$ROOT/index.html")" -gt 20000
          test "$(wc -c < "$ROOT/css/app.css")" -gt 100000
          test "$(wc -c < "$ROOT/js/app.js")" -gt 35000
          test -s "$ROOT/css/smm.css"
          test -s "$ROOT/icons/sinergy-logo.png"

      - name: Build signed clean-install APK
        working-directory: /tmp/sinergy-smm-full/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK payload identity logo and signature
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          APK=$(find /tmp/sinergy-smm-full/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='ai.sinergy.smm.full' versionCode='210' versionName='2.1.0'" /tmp/badging.txt
          grep -q "application-label:'Синергия-СММ'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          unzip -l "$APK" > /tmp/apk-files.txt
          for f in assets/www/index.html assets/www/js/app.js assets/www/css/app.css assets/www/css/smm.css assets/www/icons/sinergy-logo.png res/drawable/sinergy_logo.png; do grep -q "$f" /tmp/apk-files.txt; done
          mkdir -p /tmp/dist
          cp "$APK" /tmp/dist/SINERGY-SMM-v2.1.0-CLEAN-INSTALL.apk
          sha256sum /tmp/dist/SINERGY-SMM-v2.1.0-CLEAN-INSTALL.apk > /tmp/dist/SINERGY-SMM-v2.1.0-CLEAN-INSTALL.apk.sha256
          cp /tmp/badging.txt /tmp/dist/AAPT-BADGING.txt
          cp /tmp/signature.txt /tmp/dist/SIGNATURE-VERIFY.txt
          printf 'routes=12\npackage=ai.sinergy.smm.full\nversionCode=210\nversionName=2.1.0\nfinance_logo_sha256=28eeefc12e9e0ca5e514cf94938854e798f12674c2f6b9a00bd1a6b571fa8c0\ninstall_strategy=clean-package-id\n' > /tmp/dist/BUILD-VERIFY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.1.0-CLEAN-INSTALL-APK
          path: /tmp/dist/*
          if-no-files-found: error
          retention-days: 30
