name: Build SINERGY SMM v2 FULL APK

on:
  push:
    branches: [build-sinergy-smm-v20-full]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore full application source
        shell: bash
        run: |
          mkdir -p /tmp/sinergy-smm-full
          cat > /tmp/source.b64 <<'B64'

B64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C /tmp/sinergy-smm-full
          find /tmp/sinergy-smm-full -type f | sort
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Static application verification
        shell: bash
        run: |
          set -e
          ROOT=/tmp/sinergy-smm-full/android/app/src/main/assets/www
          node --check "$ROOT/js/app.js"
          test "$(grep -o 'class="route' "$ROOT/index.html" | wc -l)" -ge 12
          grep -q 'data-route="studio"' "$ROOT/index.html"
          grep -q 'data-route="calendar"' "$ROOT/index.html"
          grep -q 'data-route="inbox"' "$ROOT/index.html"
          grep -q 'data-route="leads"' "$ROOT/index.html"
          grep -q 'data-route="analytics"' "$ROOT/index.html"
          grep -q 'data-route="brain"' "$ROOT/index.html"
          grep -q 'data-route="integrations"' "$ROOT/index.html"
          grep -q 'smm-logo.svg' "$ROOT/index.html"
          test -s "$ROOT/css/app.css"
          test -s "$ROOT/css/smm.css"
          test -s "$ROOT/js/app.js"
          grep -q 'ai.sinergy.smm' /tmp/sinergy-smm-full/android/app/build.gradle
      - name: Build installable debug APK
        working-directory: /tmp/sinergy-smm-full/android
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify embedded application assets
        shell: bash
        run: |
          set -e
          APK=$(find /tmp/sinergy-smm-full/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/apk-files.txt
          for f in assets/www/index.html assets/www/js/app.js assets/www/css/app.css assets/www/css/smm.css assets/www/icons/smm-logo.svg res/drawable/ic_launcher.xml; do
            grep -q "$f" /tmp/apk-files.txt || { echo "Missing embedded file: $f"; exit 1; }
          done
          mkdir -p dist
          cp "$APK" dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk
          sha256sum dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk > dist/SINERGY-SMM-v2.0.0-FULL-BETA.apk.sha256
          { echo 'SINERGY SMM v2.0 FULL APK'; echo '12 routes + offline data + Finance-grade WebView shell'; wc -c /tmp/sinergy-smm-full/android/app/src/main/assets/www/index.html /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/app.css /tmp/sinergy-smm-full/android/app/src/main/assets/www/css/smm.css /tmp/sinergy-smm-full/android/app/src/main/assets/www/js/app.js; } > dist/BUILD-VERIFY.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.0.0-FULL-BETA-APK
          path: /tmp/sinergy-smm-full/android/dist/*
          if-no-files-found: error
          retention-days: 30
