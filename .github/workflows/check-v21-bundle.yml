name: Check SINERGY Finance v2.1 Bundle

on:
  push:
    branches: [build/sinergy-finance-apk]
  workflow_dispatch:

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Print part checksums and verify bundle
      shell: bash
      run: |
        set -o pipefail
        echo '=== SIZES ==='
        wc -c android/finance-bundle/v21safe.part*
        echo '=== SHA256 ==='
        sha256sum android/finance-bundle/v21safe.part*
        cat android/finance-bundle/v21safe.part* > /tmp/sinergy-finance-v21.patch.xz.b64
        echo '=== FULL BASE64 ==='
        wc -c /tmp/sinergy-finance-v21.patch.xz.b64
        sha256sum /tmp/sinergy-finance-v21.patch.xz.b64
        base64 -d /tmp/sinergy-finance-v21.patch.xz.b64 > /tmp/sinergy-finance-v21.patch.xz
        echo '=== XZ ==='
        wc -c /tmp/sinergy-finance-v21.patch.xz
        sha256sum /tmp/sinergy-finance-v21.patch.xz
        xz -t /tmp/sinergy-finance-v21.patch.xz
