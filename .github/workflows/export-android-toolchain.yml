name: Export Android Dependency Cache

on:
  push:
    branches: [build/sinergy-finance-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Download every Crypto release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/warmup
          mkdir -p /tmp/warmup/app/src/main/java/ai/sinergy/warmup
          cat > /tmp/warmup/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SinergyCryptoWarmup'
          include ':app'
          EOF
          cat > /tmp/warmup/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/warmup/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          cat > /tmp/warmup/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ai.sinergy.warmup'
              compileSdk 35
              buildToolsVersion '34.0.0'
              defaultConfig { applicationId 'ai.sinergy.warmup'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'; multiDexEnabled true }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.fragment:fragment:1.7.1'
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.credentials:credentials:1.5.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
          }
          tasks.register('resolveCryptoRelease') {
              doLast {
                  def files = configurations.releaseRuntimeClasspath.resolve().sort { it.name }
                  files.each { println("RESOLVED " + it.absolutePath + " " + it.length()) }
                  if (files.isEmpty()) throw new GradleException('No release artifacts resolved')
              }
          }
          EOF
          cat > /tmp/warmup/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application><activity android:name=".MainActivity" android:exported="true"/></application></manifest>
          EOF
          cat > /tmp/warmup/app/src/main/java/ai/sinergy/warmup/MainActivity.java <<'EOF'
          package ai.sinergy.warmup;
          public final class MainActivity extends android.app.Activity { }
          EOF
          gradle -p /tmp/warmup --no-daemon :app:resolveCryptoRelease | tee /tmp/resolved-artifacts.txt
          grep -q 'credentials-1.5.0.aar' /tmp/resolved-artifacts.txt
          grep -q 'biometric-1.1.0.aar' /tmp/resolved-artifacts.txt
          grep -q 'work-runtime-2.9.0.aar' /tmp/resolved-artifacts.txt
          grep -q 'text-recognition-16.0.1.aar' /tmp/resolved-artifacts.txt
          grep -q 'bcprov-jdk18on-1.78.1.jar' /tmp/resolved-artifacts.txt

      - name: Package full Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/full-cache
          mkdir -p /tmp/full-cache/gradle-user-home/caches
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/full-cache/gradle-user-home/caches/
          cp -a "$HOME/.gradle/caches/8.2.1" /tmp/full-cache/gradle-user-home/caches/ 2>/dev/null || true
          cp /tmp/resolved-artifacts.txt /tmp/full-cache/
          tar -C /tmp/full-cache -czf /tmp/SINERGY-GRADLE-FULL-CACHE.tar.gz .
          sha256sum /tmp/SINERGY-GRADLE-FULL-CACHE.tar.gz > /tmp/SINERGY-GRADLE-FULL-CACHE.sha256
          ls -lh /tmp/SINERGY-GRADLE-FULL-CACHE.tar.gz
          test "$(stat -c %s /tmp/SINERGY-GRADLE-FULL-CACHE.tar.gz)" -lt 536870912

      - name: Upload full dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-GRADLE-FULL-CACHE
          path: |
            /tmp/SINERGY-GRADLE-FULL-CACHE.tar.gz
            /tmp/SINERGY-GRADLE-FULL-CACHE.sha256
          compression-level: 0
          retention-days: 7
