name: Export Android Toolchain

on:
  push:
    branches: [build/sinergy-finance-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android platforms
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Resolve exact Crypto dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/warmup
          mkdir -p /tmp/warmup/app/src/main/java/ai/sinergy/warmup
          cat > /tmp/warmup/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SinergyCryptoWarmup'
          include ':app'
          EOF
          cat > /tmp/warmup/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/warmup/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          cat > /tmp/warmup/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ai.sinergy.warmup'
              compileSdk 35
              defaultConfig { applicationId 'ai.sinergy.warmup'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'; multiDexEnabled true }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.fragment:fragment:1.7.1'
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.credentials:credentials:1.5.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
          }
          EOF
          cat > /tmp/warmup/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application><activity android:name=".MainActivity" android:exported="true"/></application></manifest>
          EOF
          cat > /tmp/warmup/app/src/main/java/ai/sinergy/warmup/MainActivity.java <<'EOF'
          package ai.sinergy.warmup;
          public final class MainActivity extends android.app.Activity { }
          EOF
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          gradle -p /tmp/warmup --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > /tmp/crypto-dependencies.txt
          grep -q 'androidx.credentials:credentials:1.5.0' /tmp/crypto-dependencies.txt
          grep -q 'androidx.work:work-runtime:2.9.0' /tmp/crypto-dependencies.txt
          grep -q 'org.bouncycastle:bcprov-jdk18on:1.78.1' /tmp/crypto-dependencies.txt

      - name: Package small toolchain artifacts
        shell: bash
        run: |
          set -euo pipefail
          REAL_JAVA_HOME="$(readlink -f "${JAVA_HOME_17_X64:-$JAVA_HOME}")"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          rm -rf /tmp/sinergy-export
          mkdir -p /tmp/sinergy-export/jdk /tmp/sinergy-export/sdk/android-sdk/build-tools /tmp/sinergy-export/sdk/android-sdk/platforms /tmp/sinergy-export/cache/gradle-user-home/caches

          cp -a "$REAL_JAVA_HOME/." /tmp/sinergy-export/jdk/
          cp -a "$GRADLE_HOME" /tmp/sinergy-export/sdk/gradle-8.2.1
          cp -a "$ANDROID_SDK_ROOT/build-tools/34.0.0" /tmp/sinergy-export/sdk/android-sdk/build-tools/
          cp -a "$ANDROID_SDK_ROOT/platforms/android-34" /tmp/sinergy-export/sdk/android-sdk/platforms/
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" /tmp/sinergy-export/sdk/android-sdk/platforms/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" /tmp/sinergy-export/sdk/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/licenses" /tmp/sinergy-export/sdk/android-sdk/
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/sinergy-export/cache/gradle-user-home/caches/
          cp -a "$HOME/.gradle/caches/8.2.1" /tmp/sinergy-export/cache/gradle-user-home/caches/ 2>/dev/null || true
          cp -a "$HOME/.gradle/caches/transforms-3" /tmp/sinergy-export/cache/gradle-user-home/caches/ 2>/dev/null || true
          cp /tmp/crypto-dependencies.txt /tmp/sinergy-export/cache/

          tar -C /tmp/sinergy-export/jdk -czf /tmp/JDK17.tar.gz .
          tar -C /tmp/sinergy-export/sdk -czf /tmp/ANDROID-SDK-GRADLE.tar.gz .
          tar -C /tmp/sinergy-export/cache -czf /tmp/GRADLE-CACHE.tar.gz .
          sha256sum /tmp/JDK17.tar.gz /tmp/ANDROID-SDK-GRADLE.tar.gz /tmp/GRADLE-CACHE.tar.gz | tee /tmp/SHA256SUMS.txt
          ls -lh /tmp/JDK17.tar.gz /tmp/ANDROID-SDK-GRADLE.tar.gz /tmp/GRADLE-CACHE.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          limit=512*1024*1024
          for n in ('JDK17.tar.gz','ANDROID-SDK-GRADLE.tar.gz','GRADLE-CACHE.tar.gz'):
              p=Path('/tmp')/n
              if p.stat().st_size >= limit: raise SystemExit(f'{n} too large: {p.stat().st_size}')
          PY

      - name: Upload JDK
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-JDK17
          path: /tmp/JDK17.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Upload SDK and Gradle
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SDK-GRADLE
          path: /tmp/ANDROID-SDK-GRADLE.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Upload dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-GRADLE-CACHE
          path: |
            /tmp/GRADLE-CACHE.tar.gz
            /tmp/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
