name: Export Android Toolchain

on:
  push:
    branches: [build/sinergy-finance-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Resolve exact SINERGY Crypto dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/warmup
          mkdir -p /tmp/warmup/app/src/main/java/ai/sinergy/warmup /tmp/warmup/app/src/main/res/values
          cat > /tmp/warmup/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SinergyCryptoWarmup'
          include ':app'
          EOF
          cat > /tmp/warmup/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/warmup/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          cat > /tmp/warmup/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ai.sinergy.warmup'
              compileSdk 34
              defaultConfig { applicationId 'ai.sinergy.warmup'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'; multiDexEnabled true }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              packagingOptions { resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
          }
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.fragment:fragment:1.7.1'
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.credentials:credentials:1.5.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
          }
          EOF
          cat > /tmp/warmup/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/warmup/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > /tmp/warmup/app/src/main/java/ai/sinergy/warmup/MainActivity.java <<'EOF'
          package ai.sinergy.warmup;
          public final class MainActivity extends android.app.Activity { }
          EOF
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          gradle -p /tmp/warmup --no-daemon :app:dependencies --configuration debugRuntimeClasspath | tee /tmp/crypto-dependencies.txt
          grep -q 'androidx.credentials:credentials:1.5.0' /tmp/crypto-dependencies.txt
          grep -q 'androidx.work:work-runtime:2.9.0' /tmp/crypto-dependencies.txt
          grep -q 'org.bouncycastle:bcprov-jdk18on:1.78.1' /tmp/crypto-dependencies.txt

      - name: Package split toolchain
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          rm -rf /tmp/sinergy-split && mkdir -p /tmp/sinergy-split

          tar -C "$(dirname "$JAVA_HOME")" -czf /tmp/sinergy-split/JDK17.tar.gz "$(basename "$JAVA_HOME")"

          mkdir -p /tmp/sinergy-sdk-gradle/android-sdk
          cp -a "$GRADLE_HOME" /tmp/sinergy-sdk-gradle/gradle-8.2.1
          cp -a "$ANDROID_SDK_ROOT/build-tools" /tmp/sinergy-sdk-gradle/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/platforms" /tmp/sinergy-sdk-gradle/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/platform-tools" /tmp/sinergy-sdk-gradle/android-sdk/
          cp -a "$ANDROID_SDK_ROOT/licenses" /tmp/sinergy-sdk-gradle/android-sdk/
          tar -C /tmp -czf /tmp/sinergy-split/ANDROID-SDK-GRADLE.tar.gz sinergy-sdk-gradle

          mkdir -p /tmp/sinergy-gradle-cache/caches
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/sinergy-gradle-cache/caches/
          cp /tmp/crypto-dependencies.txt /tmp/sinergy-gradle-cache/CRYPTO-DEPENDENCIES.txt
          tar -C /tmp -czf /tmp/sinergy-split/GRADLE-MODULE-CACHE.tar.gz sinergy-gradle-cache

          sha256sum /tmp/sinergy-split/*.tar.gz | tee /tmp/sinergy-split/SHA256SUMS.txt
          ls -lh /tmp/sinergy-split
          python3 - <<'PY'
          from pathlib import Path
          limit=512*1024*1024
          for p in Path('/tmp/sinergy-split').glob('*.tar.gz'):
              print(p.name, p.stat().st_size)
              if p.stat().st_size >= limit:
                  raise SystemExit(f'{p.name} exceeds connector limit')
          PY

      - name: Upload JDK17
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-JDK17-linux-x64
          path: /tmp/sinergy-split/JDK17.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Upload Android SDK and Gradle
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-ANDROID-SDK-GRADLE-linux-x64
          path: /tmp/sinergy-split/ANDROID-SDK-GRADLE.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Upload Gradle module cache
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-GRADLE-MODULE-CACHE
          path: |
            /tmp/sinergy-split/GRADLE-MODULE-CACHE.tar.gz
            /tmp/sinergy-split/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
