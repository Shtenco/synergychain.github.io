name: Build SINERGY Finance APK

on:
  push:
    branches: [build/sinergy-finance-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Gradle 8.2.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'

    - name: Restore application sources
      shell: bash
      run: |
        cat android/finance-bundle/sf.tar.xz.b64.part* | base64 -d > /tmp/sinergy-finance.tar.xz
        tar -xJf /tmp/sinergy-finance.tar.xz -C android/app
        rm -rf android/app/src/main
        mv android/app/src/finance android/app/src/main
        test -f android/app/src/main/AndroidManifest.xml
        test -f android/app/src/main/java/ai/sinergy/finance/MainActivity.java
        test -f android/app/src/main/assets/www/index.html

    - name: Build debug APK
      run: gradle -p android clean assembleDebug --stacktrace

    - name: Verify APK
      run: |
        test -f android/app/build/outputs/apk/debug/app-debug.apk
        unzip -t android/app/build/outputs/apk/debug/app-debug.apk
        sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SINERGY-FINANCE-v1.0.0
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/debug/SHA256SUMS.txt
        if-no-files-found: error
