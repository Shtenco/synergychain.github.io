name: Build SINERGY Finance v3.1 Wallet Multicurrency

on:
  push:
    branches: [build/sinergy-finance-v31-wallet-multicurrency]
    paths:
      - '.github/workflows/sinergy-finance-v3-crypto-binary.yml'
      - 'android/finance-crypto-patch/**'
      - 'android/finance-bundle/**'
      - 'android/finance-v31-overlay/**'
      - '.github/workflows/sinergy-finance-v31-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/finance-v31-overlay/**'
      - '.github/workflows/sinergy-finance-v31-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_NAME: SINERGY-FINANCE-v3.1.0-WALLET-MULTICURRENCY.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Restore verified SINERGY Finance v2.1 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src android/app/build android/build-diagnostics android/release
          mkdir -p android/build-diagnostics android/release
          exec > >(tee android/build-diagnostics/restore.log) 2>&1

          cat android/finance-bundle/sf.tar.xz.b64.part* | base64 -d > /tmp/v1.tar.xz
          tar -xJf /tmp/v1.tar.xz -C android/app

          cat android/finance-bundle/v2.patch.xz.b64.part* | base64 -d > /tmp/v2.patch.xz
          xz -dc /tmp/v2.patch.xz > /tmp/v2.patch
          (cd android/app && patch --batch -p1 < /tmp/v2.patch)
          rm -rf android/app/src/main
          mv android/app/src/finance android/app/src/main
          cp android/app/src/main/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground_round.xml

          V21_PARTS=(
            android/finance-bundle/v21safe.part00
            android/finance-bundle/v21safe.part01
            android/finance-bundle/v21safe.part02
            android/finance-bundle/v21safe.part03
            android/finance-bundle/v21safe.part04
            android/finance-bundle/v21safe.part05
            android/finance-bundle/v21safe.part06a
            android/finance-bundle/v21safe.part06b
            android/finance-bundle/v21safe.part06c
            android/finance-bundle/v21safe.part06d
            android/finance-bundle/v21safe.part07
            android/finance-bundle/v21safe.part08
            android/finance-bundle/v21safe.part09
            android/finance-bundle/v21safe.part10
          )
          cat "${V21_PARTS[@]}" > /tmp/v21.patch.xz.b64
          echo '6f4eeaa4f192d81f5bdd72e5a284f140a829fafdd16d73b38162c780dcd63277  /tmp/v21.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/v21.patch.xz.b64 > /tmp/v21.patch.xz
          echo 'f85157a5f31c06a9c464e3914cfe0052e31e7254209af712b33cab05c823f5bf  /tmp/v21.patch.xz' | sha256sum -c -
          xz -dc /tmp/v21.patch.xz > /tmp/v21.patch
          (cd android/app && patch --batch -p1 < /tmp/v21.patch)

      - name: Apply SINERGY Finance v2.2 and Crypto Layer
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee android/build-diagnostics/overlay.log) 2>&1

          base64 -d android/finance-crypto-patch/v22-supplement.tar.xz.b64 > /tmp/v22-supplement.tar.xz
          echo '0e22a9bc73d4dbce71433e7212fa02377e7644fbc15a8f2102e13187d770b5e0  /tmp/v22-supplement.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v22-supplement.tar.xz -C android

          cat android/finance-crypto-patch/part*.b64 | base64 -d > /tmp/crypto-layer.tar.xz
          echo 'f5e8eca8bf2ba63ef700c6b2dcc4f5a36d6e00c5ac26503c0439145090a573ba  /tmp/crypto-layer.tar.xz' | sha256sum -c -
          xz -t /tmp/crypto-layer.tar.xz
          tar -xJf /tmp/crypto-layer.tar.xz -C android

          test -f android/app/src/main/assets/www/js/v22.js
          test -f android/app/src/main/assets/www/js/wallet.js
          test -f android/app/src/main/java/ai/sinergy/finance/wallet/WalletVault.java
          test -f android/app/src/main/java/ai/sinergy/finance/wallet/SmartAccountClient.java
          test -f android/app/src/main/java/ai/sinergy/finance/wallet/PasskeyManager.java
          test -f android/app/src/main/java/ai/sinergy/finance/wallet/SafeTreasuryClient.java
          grep -q "applicationId 'ai.sinergy.finance.crypto'" android/app/build.gradle
          grep -q "versionName '3.0.0-crypto-testnet'" android/app/build.gradle
          grep -q 'SinergyWalletNative' android/app/src/main/java/ai/sinergy/finance/MainActivity.java
          test -s android/app/src/main/java/ai/sinergy/finance/wallet/EvmTransactionService.java

          node --check android/app/src/main/assets/www/js/app.js
          node --check android/app/src/main/assets/www/js/v2.js
          node --check android/app/src/main/assets/www/js/v21.js
          node --check android/app/src/main/assets/www/js/v22.js
          node --check android/app/src/main/assets/www/js/wallet.js
          (cd android && node tests/run-tests.js) | tee android/build-diagnostics/unit-tests.tap

      - name: Apply SINERGY Finance v3.1 Wallet and Multicurrency overlay
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee android/build-diagnostics/v31-overlay.log) 2>&1

          cat android/finance-v31-overlay/payload.part* | tr -d '\r\n' | base64 --decode > /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz
          echo '4db8b113d7e628db644059ed59b1da51be3ccb2c45ce32b1d573387bebbdb702  /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz' | sha256sum -c -
          xz --test /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz
          rm -rf /tmp/v31-payload && mkdir -p /tmp/v31-payload
          tar -xJf /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz -C /tmp/v31-payload

          (cd android && patch --batch -p1 < /tmp/v31-payload/v31.patch)
          python3 /tmp/v31-payload/modify_sinergy.py android/app/src/main
          python3 /tmp/v31-payload/modify_index.py android/app/src/main
          python3 /tmp/v31-payload/modify_core_v21.py android/app/src/main

          cp /tmp/v31-payload/sinergy-logo-256.png /tmp/sinergy-logo.png
          echo '4b7dabfd11bc5ff0e6b2934fb12f6f9573d767837e43441cbfc863b1b6a08b21  /tmp/sinergy-logo.png' | sha256sum -c -
          mkdir -p android/app/src/main/assets/www/icons android/app/src/main/res/drawable-nodpi
          cp /tmp/sinergy-logo.png android/app/src/main/assets/www/icons/sinergy-logo.png
          cp /tmp/sinergy-logo.png android/app/src/main/res/drawable-nodpi/sinergy_logo.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp /tmp/sinergy-logo.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          if [ -d android/app/src/main/res/mipmap-anydpi-v26 ]; then
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          grep -q "applicationId 'ai.sinergy.finance.wallet'" android/app/build.gradle
          grep -q "versionName '3.1.0-wallet-multicurrency'" android/app/build.gradle
          grep -q 'createHdWallet' android/app/src/main/java/ai/sinergy/finance/wallet/WalletVault.java
          grep -q 'importMnemonic' android/app/src/main/java/ai/sinergy/finance/wallet/NativeWalletBridge.java
          grep -q 'multicurrencyAccounts' android/app/src/main/java/ai/sinergy/finance/wallet/NativeWalletBridge.java
          grep -q 'SINERGY Wallet' android/app/src/main/assets/www/index.html
          grep -q 'analyticsCustomRange' android/app/src/main/assets/www/index.html
          grep -q 'currencyCodes' android/app/src/main/assets/www/js/app.js
          grep -q 'analyticsPeriodSpec' android/app/src/main/assets/www/js/v21.js
          grep -q 'BIP39_GENERATED' android/app/src/main/java/ai/sinergy/finance/wallet/WalletVault.java

          node --check android/app/src/main/assets/www/js/app.js
          node --check android/app/src/main/assets/www/js/finance-core.js
          node --check android/app/src/main/assets/www/js/v21.js
          node --check android/app/src/main/assets/www/js/wallet.js

      - name: Compile release binaries
        shell: bash
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          gradle -p android clean assembleRelease --stacktrace --warning-mode all 2>&1 | tee android/build-diagnostics/build.log

      - name: Align and sign APK with V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED='android/release/app-release-aligned.apk'
          FINAL="android/release/${APK_NAME}"
          test -f "$UNSIGNED"

          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore /tmp/sinergy-v31-wallet.jks \
            -storepass "$PASS" -keypass "$PASS" \
            -alias sinergy-v31-wallet \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname 'CN=SINERGY Finance Wallet v3.1,O=SINERGY,C=KZ'

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks /tmp/sinergy-v31-wallet.jks \
            --ks-key-alias sinergy-v31-wallet \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee android/build-diagnostics/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$FINAL" | tee android/build-diagnostics/zipalign.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$FINAL" | tee android/build-diagnostics/badging.txt
          grep -q "package: name='ai.sinergy.finance.wallet' versionCode='1' versionName='3.1.0-wallet-multicurrency'" android/build-diagnostics/badging.txt
          unzip -t "$FINAL" | tee android/build-diagnostics/zip-integrity.txt
          unzip -l "$FINAL" | grep 'assets/www/js/v22.js'
          unzip -l "$FINAL" | grep 'assets/www/js/wallet.js'
          sha256sum "$FINAL" | tee android/release/SHA256SUMS.txt
          cp android/build-diagnostics/signature.txt android/release/SIGNATURE-REPORT.txt
          cp android/build-diagnostics/badging.txt android/release/APK-BADGING.txt

      - name: Package reproducible source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/release/source
          cp /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz android/release/source/
          cp .github/workflows/sinergy-finance-v31-build.yml android/release/source/
          find android/app/src/main/java/ai/sinergy/finance/wallet -type f -maxdepth 1 -printf '%f\n' | sort > android/release/source/CRYPTO-LAYER-FILES.txt
          sha256sum android/release/${APK_NAME} /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz > android/release/source/SHA256SUMS.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-FINANCE-v3.1-WALLET-build-diagnostics
          path: android/build-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-FINANCE-v3.1-WALLET-MULTICURRENCY
          path: android/release
          if-no-files-found: error
          retention-days: 30
