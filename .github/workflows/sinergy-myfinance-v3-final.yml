name: Build and sign SINERGY-MYFINANCE v3 APK

on:
  push:
    branches: [build/sinergy-myfinance-v3-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore audited source
        shell: bash
        run: |
          set -euo pipefail
          cat android/myfinance-v3/source.part* > /tmp/source.tar.xz
          echo '6183c5f54d2caaac0f7dc137ac6a1bb18786f707aaac94d8f05ce4672f61d811  /tmp/source.tar.xz' | sha256sum -c -
          xz -t /tmp/source.tar.xz
          mkdir -p /tmp/myfinance
          tar -xJf /tmp/source.tar.xz -C /tmp/myfinance --strip-components=1
          test -f /tmp/myfinance/app/src/main/java/ai/sinergy/myfinance/WalletVault.java
          test -f /tmp/myfinance/app/src/main/java/ai/sinergy/myfinance/BitcoinEngine.java
          test -f /tmp/myfinance/app/src/main/java/ai/sinergy/myfinance/EvmEngine.java
          test -f /tmp/myfinance/app/src/main/java/ai/sinergy/myfinance/SolanaEngine.java
          grep -q 'SINERGY-MYFINANCE' /tmp/myfinance/app/src/main/res/values/strings.xml
          grep -q "applicationId 'ai.sinergy.myfinance'" /tmp/myfinance/app/build.gradle
          node /tmp/myfinance/tests/run-tests.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Compile release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/myfinance clean assembleRelease --stacktrace | tee /tmp/myfinance/android-build.log
          test -f /tmp/myfinance/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate new signing identity and sign APK
        shell: bash
        run: |
          set -euo pipefail
          export BT="$ANDROID_HOME/build-tools/34.0.0"
          export OUT="/tmp/myfinance/final"
          mkdir -p "$OUT"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$OUT/SINERGY-MYFINANCE-release.jks" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias sinergy-myfinance-release \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 9125 \
            -dname "CN=SINERGY-MYFINANCE, OU=Release, O=SINERGY, L=Kostanay, ST=Kostanay, C=KZ"
          "$BT/zipalign" -f -p 4 \
            /tmp/myfinance/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$OUT/SINERGY-MYFINANCE-v3.0.0-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$OUT/SINERGY-MYFINANCE-release.jks" \
            --ks-key-alias sinergy-myfinance-release \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            "$OUT/SINERGY-MYFINANCE-v3.0.0-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs \
            "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            | tee "$OUT/APKSIGNER-VERIFY.txt"
          "$BT/aapt" dump badging "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            | tee "$OUT/APK-BADGING.txt"
          unzip -t "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            | tee "$OUT/APK-ZIP-INTEGRITY.txt"
          sha256sum "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            | tee "$OUT/SINERGY-MYFINANCE-v3.0.0-SHA256.txt"
          keytool -printcert -jarfile "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" \
            | tee "$OUT/SIGNING-CERTIFICATE.txt"
          printf '%s\n' "$PASS" > "$OUT/SIGNING-KEY-PASSWORD.txt"
          chmod 600 "$OUT/SIGNING-KEY-PASSWORD.txt" "$OUT/SINERGY-MYFINANCE-release.jks"
          rm -f "$OUT/SINERGY-MYFINANCE-v3.0.0-aligned.apk"

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-MYFINANCE-v3.0.0-final
          retention-days: 7
          path: |
            /tmp/myfinance/final/SINERGY-MYFINANCE-v3.0.0.apk
            /tmp/myfinance/final/APKSIGNER-VERIFY.txt
            /tmp/myfinance/final/APK-BADGING.txt
            /tmp/myfinance/final/APK-ZIP-INTEGRITY.txt
            /tmp/myfinance/final/SINERGY-MYFINANCE-v3.0.0-SHA256.txt
            /tmp/myfinance/final/SIGNING-CERTIFICATE.txt
            /tmp/myfinance/final/SINERGY-MYFINANCE-release.jks
            /tmp/myfinance/final/SIGNING-KEY-PASSWORD.txt
            /tmp/myfinance/android-build.log
          if-no-files-found: error
