name: Recover build sign and install-test SINERGY-MYFINANCE v3

on:
  push:
    branches: [build/sinergy-myfinance-v3-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete audited V3 source
        shell: bash
        run: |
          set -euo pipefail
          PARTS=(android/myfinance-v3/source.part*)
          test ${#PARTS[@]} -ge 5
          cat "${PARTS[@]}" > /tmp/source.tar.xz
          sha256sum /tmp/source.tar.xz | tee /tmp/SOURCE-ARCHIVE-SHA256.txt
          stat -c 'source archive bytes=%s' /tmp/source.tar.xz
          xz -t /tmp/source.tar.xz
          rm -rf /tmp/myfinance && mkdir -p /tmp/myfinance
          tar -xJf /tmp/source.tar.xz -C /tmp/myfinance
          APP_GRADLE="$(find /tmp/myfinance -type f -path '*/app/build.gradle' | head -n1)"
          test -n "$APP_GRADLE"
          ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "$ROOT" > /tmp/project-root.txt
          echo "project root=$ROOT"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/java/ai/sinergy/myfinance/WalletVault.java"
          test -f "$ROOT/app/src/main/java/ai/sinergy/myfinance/BitcoinEngine.java"
          test -f "$ROOT/app/src/main/java/ai/sinergy/myfinance/EvmEngine.java"
          test -f "$ROOT/app/src/main/java/ai/sinergy/myfinance/SolanaEngine.java"

      - name: Pin package version and Bouncy Castle 1.84
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/project-root.txt)"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          files = list(root.rglob('*.gradle')) + list(root.rglob('*.gradle.kts'))
          for path in files:
              text = path.read_text(encoding='utf-8')
              old = text
              for module in ('bcprov','bcpkix','bcutil','bcpg'):
                  text = re.sub(rf'org\.bouncycastle:{module}-(?:jdk15on|jdk15to18|jdk18on):[0-9A-Za-z.\-]+',
                                f'org.bouncycastle:{module}-jdk18on:1.84', text)
              text = re.sub(r'versionCode\s+\d+', 'versionCode 5', text)
              text = re.sub(r'versionName\s+["\'][^"\']+["\']', "versionName '3.0.0'", text)
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  print('patched', path)
          app = root/'app'/'build.gradle'
          txt = app.read_text(encoding='utf-8')
          assert "applicationId 'ai.sinergy.myfinance'" in txt or 'applicationId "ai.sinergy.myfinance"' in txt
          PY
          grep -RInE 'org\.bouncycastle:|applicationId|versionCode|versionName' "$ROOT"/*.gradle "$ROOT"/app/*.gradle || true

      - name: Run V3 tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/project-root.txt)"
          if [ -f "$ROOT/tests/run-tests.js" ]; then node "$ROOT/tests/run-tests.js" | tee /tmp/V3-TESTS.log; else echo 'No Node tests' | tee /tmp/V3-TESTS.log; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Resolve crypto dependencies and compile release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/project-root.txt)"
          gradle -p "$ROOT" --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > /tmp/RELEASE-DEPENDENCIES.txt
          grep 'org.bouncycastle:' /tmp/RELEASE-DEPENDENCIES.txt | tee /tmp/BOUNCY-CASTLE-RESOLUTION.txt || true
          if grep -q 'org.bouncycastle:bcprov' /tmp/RELEASE-DEPENDENCIES.txt; then grep -Eq 'org\.bouncycastle:bcprov-jdk18on:1\.84' /tmp/RELEASE-DEPENDENCIES.txt; fi
          gradle -p "$ROOT" --no-daemon clean testReleaseUnitTest assembleRelease --stacktrace | tee /tmp/ANDROID-BUILD.log
          APK="$(find "$ROOT/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*release*.apk' | head -n1)"
          test -f "$APK"
          echo "$APK" > /tmp/unsigned-apk.txt

      - name: Align and sign with a new release identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/project-root.txt)"
          APK="$(cat /tmp/unsigned-apk.txt)"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          OUT="$ROOT/final-release"
          mkdir -p "$OUT"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$OUT/SINERGY-MYFINANCE-release.jks" -storepass "$PASS" -keypass "$PASS" -alias sinergy-myfinance-release -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 9125 -dname "CN=SINERGY-MYFINANCE Release, OU=Mobile Security, O=SINERGY, L=Kostanay, ST=Kostanay, C=KZ"
          "$BT/zipalign" -f -p 4 "$APK" "$OUT/aligned.apk"
          "$BT/zipalign" -c -p 4 "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$OUT/SINERGY-MYFINANCE-release.jks" --ks-key-alias sinergy-myfinance-release --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/APKSIGNER-VERIFY.txt"
          "$BT/aapt" dump badging "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/APK-BADGING.txt"
          unzip -t "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/APK-ZIP-INTEGRITY.txt"
          sha256sum "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/SINERGY-MYFINANCE-v3.0.0-SHA256.txt"
          keytool -printcert -jarfile "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/SIGNING-CERTIFICATE.txt"
          printf '%s\n' "$PASS" > "$OUT/SIGNING-KEY-PASSWORD.txt"
          cp /tmp/SOURCE-ARCHIVE-SHA256.txt /tmp/V3-TESTS.log /tmp/RELEASE-DEPENDENCIES.txt /tmp/BOUNCY-CASTLE-RESOLUTION.txt /tmp/ANDROID-BUILD.log "$OUT/"
          rm -f "$OUT/aligned.apk"

      - name: Verify real installation on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ROOT="$(cat /tmp/project-root.txt)"
            OUT="$ROOT/final-release"
            adb install -r "$OUT/SINERGY-MYFINANCE-v3.0.0.apk" | tee "$OUT/ADB-INSTALL.txt"
            adb shell pm path ai.sinergy.myfinance | tee -a "$OUT/ADB-INSTALL.txt"
            adb shell dumpsys package ai.sinergy.myfinance | grep -E 'versionCode=|versionName=' | tee -a "$OUT/ADB-INSTALL.txt"
            test -n "$(adb shell pm path ai.sinergy.myfinance)"
            if find "$ROOT/app/src/androidTest" -type f 2>/dev/null | grep -q .; then gradle -p "$ROOT" --no-daemon connectedReleaseAndroidTest --stacktrace | tee "$OUT/INSTRUMENTATION-TESTS.log"; else echo 'No androidTest sources; APK installation verified on API 34 emulator.' | tee "$OUT/INSTRUMENTATION-TESTS.log"; fi

      - name: Upload installable V3 release
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-MYFINANCE-v3.0.0-installable
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/myfinance/**/final-release/*
