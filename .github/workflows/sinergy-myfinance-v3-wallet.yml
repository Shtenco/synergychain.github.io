name: Build SINERGY-MYFINANCE v3 Wallet

on:
  push:
    branches: [build/sinergy-myfinance-v3-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact audited source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/myfinance-parts /tmp/myfinance-src
          for p in 00 01 02; do
            base64 -d "android/myfinance-v3/source.b64.part${p}" > "/tmp/myfinance-parts/part${p}"
          done
          for p in 03 04; do
            base64 -d "android/myfinance-v3/source.part${p}.b64" > "/tmp/myfinance-parts/part${p}"
          done
          cat /tmp/myfinance-parts/part00 /tmp/myfinance-parts/part01 /tmp/myfinance-parts/part02 /tmp/myfinance-parts/part03 /tmp/myfinance-parts/part04 > /tmp/sinergy-myfinance-v3-source.tar.xz
          echo '6183c5f54d2caaac0f7dc137ac6a1bb18786f707aaac94d8f05ce4672f61d811  /tmp/sinergy-myfinance-v3-source.tar.xz' | sha256sum -c -
          xz -t /tmp/sinergy-myfinance-v3-source.tar.xz
          tar -xJf /tmp/sinergy-myfinance-v3-source.tar.xz -C /tmp/myfinance-src
          test -f /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/app/src/main/java/ai/sinergy/myfinance/WalletVault.java
          test -f /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/app/src/main/java/ai/sinergy/myfinance/BitcoinEngine.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Run deterministic JS tests
        working-directory: /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30
        run: node tests/run-tests.js | tee reports/unit-tests-ci.tap

      - name: Compile release and debug APKs
        working-directory: /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30
        shell: bash
        run: |
          set -o pipefail
          gradle clean assembleRelease assembleDebug --stacktrace --warning-mode all 2>&1 | tee reports/gradle-build-ci.log

      - name: Verify compiled packages
        working-directory: /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk | tee reports/apk-unzip-ci.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk | tee reports/apk-sha256-ci.txt

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-MYFINANCE-v3.0.0-compiled
          path: |
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/app/build/outputs/apk/release/app-release-unsigned.apk
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/app/build/outputs/apk/debug/app-debug.apk
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/reports/unit-tests-ci.tap
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/reports/gradle-build-ci.log
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/reports/apk-unzip-ci.txt
            /tmp/myfinance-src/SINERGY_MYFINANCE_ANDROID_V30/reports/apk-sha256-ci.txt
          if-no-files-found: error
