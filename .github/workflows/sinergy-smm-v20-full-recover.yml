name: SINERGY SMM v2 FULL Recover

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct full source blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/full/source /tmp/full/out
          cat smm-v2-build/source.b64.part00 smm-v2-build/source.b64.part01 smm-v2-build/source.b64.part02 smm-v2-build/source.b64.part03 smm-v2-build/source.b64.part04 > /tmp/full/source.b64
          base64 -d /tmp/full/source.b64 > /tmp/full/source.bin
          file /tmp/full/source.bin | tee /tmp/full/out/TYPE.txt
          if tar -tzf /tmp/full/source.bin >/tmp/full/out/TREE.txt 2>/dev/null; then
            tar -xzf /tmp/full/source.bin -C /tmp/full/source
          elif unzip -l /tmp/full/source.bin >/tmp/full/out/TREE.txt 2>/dev/null; then
            unzip -q /tmp/full/source.bin -d /tmp/full/source
          else
            echo UNKNOWN_SOURCE_CONTAINER >&2
            exit 1
          fi
          {
            echo '=== FILES ==='
            find /tmp/full/source -type f | sort
            echo '=== FUNCTION HITS ==='
            grep -RniE 'like|comment|campaign|broadcast|message|direct|mail|рассыл|коммент|лайк|whatsapp|instagram|facebook|telegram|vk|zen|autopilot|crm|audience|provider' /tmp/full/source --exclude='*.map' | head -n 5000 || true
            echo '=== LOGO / LAUNCHER ==='
            find /tmp/full/source -type f \( -iname '*logo*' -o -iname '*launcher*' -o -path '*/mipmap-*/*' -o -path '*/drawable*/*' \) | sort
          } > /tmp/full/out/FULL-RECOVERY-REPORT.txt
          cd /tmp/full/source
          zip -qr /tmp/full/out/SINERGY-SMM-v2-FULL-RECOVERED-SOURCE.zip .
          sha256sum /tmp/full/out/SINERGY-SMM-v2-FULL-RECOVERED-SOURCE.zip > /tmp/full/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2-FULL-RECOVERED
          path: /tmp/full/out/*
          if-no-files-found: error
          retention-days: 30
