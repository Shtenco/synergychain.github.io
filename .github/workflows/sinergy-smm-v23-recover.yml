name: SINERGY SMM v2.3 Recover

on:
  push:
    branches: [sinergy-smm-v3-release-gates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct audited v2.3 clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovered
          cat smm-v2-clean/part00 smm-v2-clean/part01 smm-v2-clean/part02 smm-v2-clean/part03 smm-v2-clean/part04 smm-v2-clean/part05 smm-v2-clean/part06 smm-v2-clean/part07 > /tmp/v23.b64
          base64 -d /tmp/v23.b64 > /tmp/v23.tar.gz
          tar -tzf /tmp/v23.tar.gz > /tmp/recovered/TREE.txt
          mkdir -p /tmp/recovered/source
          tar -xzf /tmp/v23.tar.gz -C /tmp/recovered/source
          {
            echo '=== TOP LEVEL ==='
            find /tmp/recovered/source -maxdepth 3 -type f | sort
            echo '=== FUNCTION TOKENS ==='
            grep -RniE 'like|comment|campaign|mail|broadcast|message|direct|рассыл|коммент|лайк|whatsapp|instagram|facebook|telegram|vk|zen|autopilot|crm|audience' /tmp/recovered/source --exclude='*.map' | head -n 2000 || true
            echo '=== LOGO/ANDROID RESOURCES ==='
            find /tmp/recovered/source -type f \( -iname '*logo*' -o -iname '*launcher*' -o -path '*/mipmap-*/*' \) | sort
          } > /tmp/recovered/RECOVERY-REPORT.txt
          cd /tmp/recovered/source
          zip -qr /tmp/recovered/SINERGY-SMM-v2.3-RECOVERED-SOURCE.zip .
          sha256sum /tmp/recovered/SINERGY-SMM-v2.3-RECOVERED-SOURCE.zip > /tmp/recovered/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v2.3-RECOVERED
          path: |
            /tmp/recovered/SINERGY-SMM-v2.3-RECOVERED-SOURCE.zip
            /tmp/recovered/TREE.txt
            /tmp/recovered/RECOVERY-REPORT.txt
            /tmp/recovered/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
