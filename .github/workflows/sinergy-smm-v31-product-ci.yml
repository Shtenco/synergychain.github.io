name: SINERGY SMM v3.1 PRO Signed Product CI

on:
  push:
    branches: [sinergy-smm-v3-product-v31-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified v3 base source
        shell: bash
        run: |
          set -euo pipefail
          echo '767458314b952d2fc44a2289f9e139550f9d0f61035dd5b54c226721034c5847  smm-v3-ci/runtime_noicons.part00' | sha256sum -c -
          cat smm-v3-ci/runtime_fix.part01a smm-v3-ci/runtime_fix.part01b > /tmp/part01
          echo 'd9eec4f6da1036751f52d177827f6a5a06dd7ba48d1731a52e823ca98ae98aba  /tmp/part01' | sha256sum -c -
          echo '646497e83b6c6d17d9a10ce392d78ca2fe256190ec00c9fd810873c5fd0fef15  smm-v3-ci/runtime_fix.part02a' | sha256sum -c -
          echo 'e8e6f6509b539823cdb2f14cd7ce78d2012ed30d8294ee9f7d7246d9d2df0bc7  smm-v3-ci/runtime_fix.part03' | sha256sum -c -
          cat smm-v3-ci/runtime_noicons.part00 /tmp/part01 smm-v3-ci/runtime_fix.part02a smm-v3-ci/runtime_fix.part03 > /tmp/runtime.b64
          base64 -d /tmp/runtime.b64 > /tmp/runtime.tar.gz
          echo '0306671d5315792bd3e4979d134f61879965ed61a13597cddfe000ec54566c13  /tmp/runtime.tar.gz' | sha256sum -c -
          mkdir -p /tmp/base
          tar -xzf /tmp/runtime.tar.gz -C /tmp/base --strip-components=1

      - name: Restore exact SINERGY Finance launcher
        shell: bash
        run: |
          set -euo pipefail
          echo '0af53e6ca79e38a2dfb6bc3b689453b38c01a150337154dc0ad441ef4d486cc4  smm-v3-product-v31/finance-launcher.b64.part00' | sha256sum -c -
          echo 'b158748dd2af573ebe62cf346e666379b108fd019d39f4c4945ea245d90012a1  smm-v3-product-v31/finance-launcher.b64.part01' | sha256sum -c -
          echo 'af055fee758361c772f4be7430b7f9b5ca23a8e3255bfcd66f0094db7a8aeef5  smm-v3-product-v31/finance-launcher.b64.part02' | sha256sum -c -
          cat smm-v3-product-v31/finance-launcher.b64.part00 smm-v3-product-v31/finance-launcher.b64.part01 smm-v3-product-v31/finance-launcher.b64.part02 > /tmp/finance-launcher.b64
          echo '9093a533b93db859604e809c1fa8231142b72b05aefffd23babc77cd7bc7a617  /tmp/finance-launcher.b64' | sha256sum -c -
          base64 -d /tmp/finance-launcher.b64 > /tmp/finance-launcher.png
          echo '7fcb15af804c98d61e7baec76848caac8b1638e774c9795ebda83396082a6ac6  /tmp/finance-launcher.png' | sha256sum -c -
          file /tmp/finance-launcher.png

      - name: Verify and apply v3.1 product builder
        shell: bash
        run: |
          set -euo pipefail
          echo 'fbcf1c4b55e036e4af406d401fe5b86e15b97b0612a7d82abfdfa994c1285c22  smm-v3-product-v31/build_v31_ci.py.gz.b64' | sha256sum -c -
          base64 -d smm-v3-product-v31/build_v31_ci.py.gz.b64 > /tmp/build_v31.py.gz
          echo '12d6efb31025a9d33b49c639ada6c4f845e938fdf5b4881c4750393f60fe18aa  /tmp/build_v31.py.gz' | sha256sum -c -
          gzip -dc /tmp/build_v31.py.gz > /tmp/build_v31.py
          echo '41c2dafefb03262245259b773b4c45e59dbbd3138146a8c4256a40f21a248b85  /tmp/build_v31.py' | sha256sum -c -
          SMM_BASE=/tmp/base SMM_OUT=/tmp/smm-v31 FINANCE_LAUNCHER=/tmp/finance-launcher.png python /tmp/build_v31.py
          grep -q "applicationId 'ai.sinergy.smm.pro'" /tmp/smm-v31/android/app/build.gradle
          grep -q 'android:label="Синергия-СММ"' /tmp/smm-v31/android/app/src/main/AndroidManifest.xml
          python - <<'PY'
          import json
          r=json.load(open('/tmp/smm-v31/backend/action_registry.json'))
          assert len(r)==77 and len({x['id'] for x in r})==77
          print('REGISTRY_77_PASS')
          PY
          echo '7fcb15af804c98d61e7baec76848caac8b1638e774c9795ebda83396082a6ac6  /tmp/smm-v31/android/app/src/main/assets/www/icons/sinergy-logo.png' | sha256sum -c -
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            echo "7fcb15af804c98d61e7baec76848caac8b1638e774c9795ebda83396082a6ac6  /tmp/smm-v31/android/app/src/main/res/mipmap-$d/ic_launcher.png" | sha256sum -c -
          done

      - name: Backend contract tests
        run: python /tmp/smm-v31/tests/backend/contract_test.py

      - name: Browser E2E 13 routes / 78 screenshots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          if command -v chromium >/dev/null; then
            :
          elif command -v google-chrome >/dev/null; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
          else
            sudo apt-get update
            sudo apt-get install -y chromium
          fi
          python /tmp/smm-v31/tests/web/e2e.py
          test "$(find /tmp/smm-v31/SCREENSHOTS -name '*.png' | wc -l)" -eq 78

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build unsigned release
        working-directory: /tmp/smm-v31/android
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Generate canonical release key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/product-evidence
          mkdir -p "$OUT"
          UNSIGNED=$(find /tmp/smm-v31/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -s "$UNSIGNED"
          PASS=$(openssl rand -hex 24)
          KEY=/tmp/SINERGY-SMM-RELEASE-2026-CANONICAL.jks
          keytool -genkeypair -v \
            -keystore "$KEY" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias sinergy-smm-release \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname 'CN=SINERGY SMM Release 2026, OU=Android Release, O=SINERGY, C=KZ' >/dev/null 2>&1
          zipalign -P 16 -f 4 "$UNSIGNED" /tmp/SINERGY-SMM-v3.1.0-PRO-ALIGNED.apk
          apksigner sign \
            --ks "$KEY" --ks-key-alias sinergy-smm-release \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT/SINERGY-SMM-v3.1.0-PRO-SIGNED.apk" \
            /tmp/SINERGY-SMM-v3.1.0-PRO-ALIGNED.apk
          apksigner verify --verbose --print-certs "$OUT/SINERGY-SMM-v3.1.0-PRO-SIGNED.apk" | tee "$OUT/APKSIGNER-VERIFY.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/APKSIGNER-VERIFY.txt"
          cp "$KEY" "$OUT/SINERGY-SMM-RELEASE-2026-CANONICAL.jks"
          cat > "$OUT/RECOVERY.txt" <<EOF
          Application ID: ai.sinergy.smm.pro
          App name: Синергия-СММ
          Alias: sinergy-smm-release
          Store password: $PASS
          Key password: $PASS
          Generated by: GitHub Actions canonical signed product build
          IMPORTANT: keep this JKS + password permanently; all future updates must use this key.
          EOF
          keytool -list -v -keystore "$KEY" -storepass "$PASS" -alias sinergy-smm-release > "$OUT/CERTIFICATE-DETAILS.txt"
          grep 'SHA256:' "$OUT/CERTIFICATE-DETAILS.txt" | head -1 > "$OUT/PUBLIC-FINGERPRINT.txt"
          aapt2 dump badging "$OUT/SINERGY-SMM-v3.1.0-PRO-SIGNED.apk" | tee "$OUT/AAPT-BADGING.txt"
          grep -q "package: name='ai.sinergy.smm.pro'" "$OUT/AAPT-BADGING.txt"
          tar --exclude='SCREENSHOTS' -czf "$OUT/SINERGY-SMM-v3.1.0-CANONICAL-SOURCE.tar.gz" -C /tmp/smm-v31 .
          cp /tmp/smm-v31/PRODUCT-MANIFEST.json "$OUT/PRODUCT-MANIFEST.json"
          sha256sum "$KEY" "$OUT/SINERGY-SMM-v3.1.0-PRO-SIGNED.apk" "$OUT/SINERGY-SMM-v3.1.0-CANONICAL-SOURCE.tar.gz" > "$OUT/SHA256SUMS.txt"
          printf 'BASE_SOURCE_SHA_PASS\nFINANCE_LAUNCHER_SHA_PASS\nBUILDER_SHA_PASS\nREGISTRY_77_PASS\nBACKEND_9_PASS\nWEB_13_ROUTE_78_SCREENSHOT_PASS\nGRADLE_RELEASE_PASS\nNEW_RSA3072_KEY_CREATED\nAPK_V2_SIGNATURE_PASS\nPACKAGE_PRO_PASS\nFINANCE_LOGO_BYTE_PARITY_PASS\n' > "$OUT/STATIC-GATES.txt"

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: API35 signed install / FIRST_FRAME / restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            APK=/tmp/product-evidence/SINERGY-SMM-v3.1.0-PRO-SIGNED.apk
            adb logcat -c
            adb install -r "$APK" | tee /tmp/product-evidence/ADB-INSTALL.txt
            grep -q Success /tmp/product-evidence/ADB-INSTALL.txt
            adb shell am start -W -n ai.sinergy.smm.pro/ai.sinergy.smm.MainActivity | tee /tmp/product-evidence/ADB-LAUNCH.txt
            sleep 5
            adb logcat -d > /tmp/product-evidence/LOGCAT-FIRST.txt
            grep -q 'SINERGY_SMM.*FIRST_FRAME home' /tmp/product-evidence/LOGCAT-FIRST.txt
            ! grep -Eqi 'FATAL EXCEPTION|ANR in ai\.sinergy\.smm\.pro|SINERGY_SMM.*WEB_FATAL' /tmp/product-evidence/LOGCAT-FIRST.txt
            adb exec-out screencap -p > /tmp/product-evidence/ANDROID-HOME.png
            test -s /tmp/product-evidence/ANDROID-HOME.png
            adb shell input keyevent 4
            adb shell am force-stop ai.sinergy.smm.pro
            adb shell am start -W -n ai.sinergy.smm.pro/ai.sinergy.smm.MainActivity > /tmp/product-evidence/ADB-RESTART.txt
            sleep 4
            adb logcat -d > /tmp/product-evidence/LOGCAT-RESTART.txt
            grep -q 'SINERGY_SMM.*FIRST_FRAME home' /tmp/product-evidence/LOGCAT-RESTART.txt
            ! grep -Eqi 'FATAL EXCEPTION|ANR in ai\.sinergy\.smm\.pro|SINERGY_SMM.*WEB_FATAL' /tmp/product-evidence/LOGCAT-RESTART.txt
            adb exec-out screencap -p > /tmp/product-evidence/ANDROID-RESTART.png
            test -s /tmp/product-evidence/ANDROID-RESTART.png
            printf 'SIGNED_ADB_INSTALL_PASS\nSIGNED_FIRST_FRAME_HOME_PASS\nSIGNED_ANDROID_SCREENSHOT_PASS\nSIGNED_BACK_RESTART_PASS\n' > /tmp/product-evidence/ANDROID-GATES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v3.1-PRO-CANONICAL-SIGNED
          path: /tmp/product-evidence/*
          if-no-files-found: error
          retention-days: 1
