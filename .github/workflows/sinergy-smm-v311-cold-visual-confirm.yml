name: SINERGY SMM v3.1.1 Cold Visual Confirm

on:
  push:
    branches: [sinergy-smm-v3-product-v31-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cold-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exact v3.1.1 canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v311 /tmp/cold-evidence
          mkdir -p /tmp/v311 /tmp/cold-evidence
          gh run download 32907313576 --repo Shtenco/synergychain.github.io --name SINERGY-SMM-v3.1.1-PRO-CANONICAL-RELEASE --dir /tmp/v311
          echo '93e462ec96446c01d061cbf089bcf6432641081ae383aebb4ce69eb0be3e86fc  /tmp/v311/SINERGY-SMM-v3.1.1-PRO-SIGNED.apk' | sha256sum -c -
          cp /tmp/v311/APKSIGNER-VERIFY.txt /tmp/cold-evidence/
          cp /tmp/v311/AAPT-BADGING.txt /tmp/cold-evidence/
      - uses: android-actions/setup-android@v3
      - name: Install Pillow validator
        run: |
          python -m pip install --quiet pillow
          cat > /tmp/check_strong_visual.py <<'PY'
          import sys
          from PIL import Image, ImageStat
          p=sys.argv[1]
          im=Image.open(p).convert('RGB')
          w,h=im.size
          crop=im.crop((0,max(140,int(h*.08)),w,min(h-150,int(h*.92))))
          pix=list(crop.getdata())
          nonblack=sum(1 for r,g,b in pix if max(r,g,b)>30)/len(pix)
          bright=sum(1 for r,g,b in pix if max(r,g,b)>80)/len(pix)
          verybright=sum(1 for r,g,b in pix if max(r,g,b)>160)/len(pix)
          std=max(ImageStat.Stat(crop).stddev)
          print(f'STRONG_VISUAL nonblack={nonblack:.6f} bright={bright:.6f} verybright={verybright:.6f} std={std:.3f}')
          assert nonblack > 0.10
          assert bright > 0.025, 'main UI content not sufficiently rendered'
          assert verybright > 0.005, 'expected visible text/cards missing'
          assert std > 10.0
          PY
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: API35 exact canonical cold/restart visual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb logcat -c
            adb install -r /tmp/v311/SINERGY-SMM-v3.1.1-PRO-SIGNED.apk | tee /tmp/cold-evidence/ADB-INSTALL.txt
            grep -q Success /tmp/cold-evidence/ADB-INSTALL.txt
            adb shell am start -W -n ai.sinergy.smm.pro/ai.sinergy.smm.MainActivity | tee /tmp/cold-evidence/ADB-COLD-LAUNCH.txt
            sleep 15
            adb logcat -d > /tmp/cold-evidence/LOGCAT-COLD.txt
            grep -q 'SINERGY_SMM.*FIRST_FRAME home' /tmp/cold-evidence/LOGCAT-COLD.txt
            grep -q 'SINERGY_SMM.*PAGE_FINISHED' /tmp/cold-evidence/LOGCAT-COLD.txt
            ! grep -Eqi 'FATAL EXCEPTION|ANR in ai\.sinergy\.smm\.pro|SINERGY_SMM.*WEB_FATAL' /tmp/cold-evidence/LOGCAT-COLD.txt
            adb exec-out screencap -p > /tmp/cold-evidence/ANDROID-COLD-15S.png
            python /tmp/check_strong_visual.py /tmp/cold-evidence/ANDROID-COLD-15S.png | tee /tmp/cold-evidence/STRONG-COLD.txt
            adb shell am force-stop ai.sinergy.smm.pro
            adb shell am start -W -n ai.sinergy.smm.pro/ai.sinergy.smm.MainActivity | tee /tmp/cold-evidence/ADB-RESTART.txt
            sleep 10
            adb logcat -d > /tmp/cold-evidence/LOGCAT-RESTART.txt
            grep -q 'SINERGY_SMM.*FIRST_FRAME home' /tmp/cold-evidence/LOGCAT-RESTART.txt
            ! grep -Eqi 'FATAL EXCEPTION|ANR in ai\.sinergy\.smm\.pro|SINERGY_SMM.*WEB_FATAL' /tmp/cold-evidence/LOGCAT-RESTART.txt
            adb exec-out screencap -p > /tmp/cold-evidence/ANDROID-RESTART-10S.png
            python /tmp/check_strong_visual.py /tmp/cold-evidence/ANDROID-RESTART-10S.png | tee /tmp/cold-evidence/STRONG-RESTART.txt
            printf 'EXACT_V311_APK_SHA_PASS\nCOLD_15S_STRONG_VISUAL_PASS\nRESTART_10S_STRONG_VISUAL_PASS\n' > /tmp/cold-evidence/COLD-VISUAL-GATES.txt
      - name: Upload cold visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-SMM-v3.1.1-COLD-VISUAL-EVIDENCE
          path: /tmp/cold-evidence/*
          if-no-files-found: warn
          retention-days: 3
