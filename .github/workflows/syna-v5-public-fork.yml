name: SYNA V5 Polygon Fork

on:
  push:
    branches:
      - ci/syna-v5-public-fork-20260805
    paths:
      - 'ci/syna-v5-public-fork/**'
      - '.github/workflows/syna-v5-public-fork.yml'

permissions:
  contents: read

env:
  POLYGON_RPC: https://polygon-bor-rpc.publicnode.com
  FORK_CYCLES: '3'
  FORK_FEE_CEILING_GWEI: '2000'
  FORK_DEBUG: '1'

jobs:
  fork-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/syna-v5-public-fork/package-lock-placeholder

      - name: Create ephemeral fork-only wallet
        run: echo "OWNER_PRIVATE_KEY=0x$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Reconstruct and verify clean test package
        run: |
          mkdir -p /tmp/syna-v5
          cat ci/syna-v5-public-fork/project.b64.* | base64 --decode > /tmp/syna-v5/project.tar.gz
          test "$(stat -c%s /tmp/syna-v5/project.tar.gz)" = "18409"
          echo "c126d0f9c9efcfa292e759ba3901ea9d9ca2807927fc72bd88e296a84c478b4a  /tmp/syna-v5/project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syna-v5/project.tar.gz -C /tmp/syna-v5
          rm /tmp/syna-v5/project.tar.gz
          ! find /tmp/syna-v5 -type f \( -name '.env' -o -name 'private.env' \) | grep .

      - name: Install dependencies
        working-directory: /tmp/syna-v5
        run: npm ci --no-audit --no-fund

      - name: Static validation
        working-directory: /tmp/syna-v5
        run: npm run validate:static 2>&1 | tee static.log

      - name: Compile and bytecode-size test
        working-directory: /tmp/syna-v5
        run: |
          npm run compile 2>&1 | tee compile.log
          npm test 2>&1 | tee test.log

      - name: Polygon fork deployment, cycles and cash-out
        working-directory: /tmp/syna-v5
        run: npm run fork:test 2>&1 | tee fork.log

      - name: Upload fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syna-v5-public-fork-evidence
          path: |
            /tmp/syna-v5/static.log
            /tmp/syna-v5/compile.log
            /tmp/syna-v5/test.log
            /tmp/syna-v5/fork.log
            /tmp/syna-v5/artifacts/contracts/**/*.json
          if-no-files-found: warn
          retention-days: 7
