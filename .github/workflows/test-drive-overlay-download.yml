name: Verify SINERGY v3.1 CI Payload

on:
  push:
    branches:
      - build/sinergy-finance-v31-wallet-multicurrency
    paths:
      - '.github/workflows/test-drive-overlay-download.yml'
      - 'android/finance-v31-overlay/payload.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-drive-overlay-download.yml'
      - 'android/finance-v31-overlay/payload.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify v3.1 payload
        shell: bash
        run: |
          set -euxo pipefail
          wc -c android/finance-v31-overlay/payload.part*
          sha256sum android/finance-v31-overlay/payload.part*
          cat android/finance-v31-overlay/payload.part* | tr -d '\r\n' > /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz.b64
          wc -c /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz.b64
          sha256sum /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz.b64
          base64 --decode /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz.b64 > /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz
          sha256sum /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz
          echo '4db8b113d7e628db644059ed59b1da51be3ccb2c45ce32b1d573387bebbdb702  /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz' | sha256sum -c -
          xz --test /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz
          mkdir -p /tmp/v31-payload
          tar -xJf /tmp/SINERGY-v31-CI-PAYLOAD.tar.xz -C /tmp/v31-payload
          test -f /tmp/v31-payload/v31.patch
          test -f /tmp/v31-payload/modify_sinergy.py
          test -f /tmp/v31-payload/modify_index.py
          test -f /tmp/v31-payload/modify_core_v21.py
          test -f /tmp/v31-payload/sinergy-logo-256.png
          find /tmp/v31-payload -maxdepth 1 -type f -printf '%f\n' | sort
