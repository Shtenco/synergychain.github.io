name: V12.4 EVM public Base fork

on:
  pull_request:
    branches: [ main ]

jobs:
  evm-base-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_RPC_URL: https://mainnet.base.org
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Foundry version
        run: forge --version
      - name: Run V12.4 Base fork tests
        working-directory: evm_v12_4
        run: forge test -vvvv
