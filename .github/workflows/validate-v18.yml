name: Validate SINERGY V18

on:
  push:
    branches: [portal-v18-top]
    paths:
      - 'v18/**'
      - 'scripts/validate-v18.mjs'
      - 'scripts/smoke-v18.mjs'
      - 'scripts/build-v18-standalone.mjs'
      - 'scripts/smoke-v18-offline.mjs'
      - 'docs/**'
      - '.github/workflows/validate-v18.yml'
  pull_request:
    paths:
      - 'v18/**'
      - 'scripts/validate-v18.mjs'
      - 'scripts/smoke-v18.mjs'
      - 'scripts/build-v18-standalone.mjs'
      - 'scripts/smoke-v18-offline.mjs'
      - 'docs/**'
      - '.github/workflows/validate-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: find v18 scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Registry, graph, links and secrets
        run: node scripts/validate-v18.mjs
      - name: Build standalone HTML bundle
        run: node scripts/build-v18-standalone.mjs v18 release/V18_STANDALONE

  chromium-smoke:
    runs-on: ubuntu-latest
    needs: structural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/v18-http.log 2>&1 &
          echo $! > /tmp/v18-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v18/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v18-http.log
          exit 1
      - name: HTTP desktop, mobile and reduced-motion smoke
        run: node scripts/smoke-v18.mjs
      - name: Build OFFLINE/STANDALONE release
        run: node scripts/build-v18-standalone.mjs v18 release/V18_STANDALONE
      - name: FILE protocol desktop, mobile and reduced-motion smoke
        run: node scripts/smoke-v18-offline.mjs
      - name: Upload HTTP visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-http-visual-smoke
          path: artifacts/v18-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Upload FILE visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-file-visual-smoke
          path: artifacts/v18-offline-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Upload standalone green site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-V18-STANDALONE-GREEN-${{ github.sha }}
          path: release/V18_STANDALONE
          if-no-files-found: error
          retention-days: 30

  source-package:
    runs-on: ubuntu-latest
    needs: [structural, chromium-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible source package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="release/SINERGY_V18_SOURCE"
          mkdir -p "$ROOT/.github/workflows"
          cp -a v18 "$ROOT/"
          cp -a scripts "$ROOT/"
          cp -a docs "$ROOT/"
          cp .github/workflows/validate-v18.yml "$ROOT/.github/workflows/validate-v18.yml"
          for f in README.md README-V17.md; do [ -f "$f" ] && cp "$f" "$ROOT/"; done
          node scripts/build-v18-standalone.mjs v18 "$ROOT/OFFLINE_STANDALONE"
          cat > "$ROOT/BUILD_INFO.txt" <<EOF
          SINERGY V18 GREEN SOURCE PACKAGE
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          workflow_run=${GITHUB_RUN_ID}
          structural=success
          http_chromium_smoke=success
          file_protocol_chromium_smoke=success
          offline_standalone=included
          EOF
          (
            cd "$ROOT"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
      - name: Upload green source package
        uses: actions/upload-artifact@v4
        with:
          name: SINERGY-V18-SOURCE-GREEN-${{ github.sha }}
          path: release/SINERGY_V18_SOURCE
          if-no-files-found: error
          retention-days: 30
